name = "manicepte-maintenance"
main = "worker.ts"
compatibility_date = "2026-10-01"

[vars]
APP_URL = "https://manicepte.com"
# Optional: activate only after configuring a separate, protected origin hostname.
# GATEWAY_ORIGIN = "https://origin.manicepte.com"

[[durable_objects.bindings]]
name = "STATUS"
class_name = "MaintenanceState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MaintenanceState"]

# ADMIN_TOKEN is a secret: set through `wrangler secret put ADMIN_TOKEN`.
