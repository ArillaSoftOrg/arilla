[project]
name = "arilla-ingest"
version = "0.0.0"
description = "Toplu isler: feed toplama, zenginlestirme, eslestirme, benzerlik."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "redis>=5.0",
    # Gorsel on isleme (karar 0028): cozme, EXIF, kucultme, yeniden kodlama.
    "pillow>=11.3",
    # Link cozumleme Vercel Queues aboneligi (karar 0107). Yalnizca
    # `collect.link.subscriber` ice aktarir; Redis worker'i etkilenmez.
    "vercel-queue>=0.9.1,<1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14.0",
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "db",
    "collect",
    "collect.sources",
    "collect.link",
    "curate",
    "enrich",
    "feeds",
    "resolve",

    "similarity",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Entegrasyon testleri yerel veritabanina baglanir; isaretli olsunlar ki
# veritabani olmadan `-m "not integration"` ile atlanabilsinler.
markers = [
    "integration: yerel PostgreSQL gerektirir",
]

# Vercel Queues abonesi (karar 0107). Vercel derleme aninda bu modulu ice alip
# ozel, kuyruk tetiklemeli bir fonksiyon uretir; herkese acik rota yoktur.
# Yalnizca Vercel `services` ile dagitilirsa anlam kazanir (kok vercel.json);
# bugunku dagitimda (Root Directory apps/web) hicbir etkisi yoktur.
[[tool.vercel.subscribers]]
entrypoint = "collect.link.subscriber"
