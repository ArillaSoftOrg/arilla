[project]
name = "arilla-ingest"
version = "0.0.0"
description = "Toplu isler: feed toplama, zenginlestirme, eslestirme, benzerlik."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "httpx>=0.28",
    "redis>=5.0",
    # Gorsel on isleme (karar 0028): cozme, EXIF, kucultme, yeniden kodlama.
    "pillow>=11.3",
    # Link cozumleme Vercel Queues aboneligi (karar 0107). Yalnizca
    # `collect.link.subscriber` ice aktarir; Redis worker'i etkilenmez.
    "vercel-queue>=0.9.1,<1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14.0",
    "pytest>=8.3",
    # Hibrit oneri motoru testleri (karar 0155): sahte gomme ile, model gerekmez.
    "numpy>=1.26",
]
# Hibrit kategori onerisi toplu isi (karar 0155). Uretim imajina KONMAZ; pilot oncesi karar gerekir.
suggest = [
    "numpy>=1.26",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "psutil>=5.9",
]
# Yalniz modeli ureten gelistirici araci (`classify suggest model build`).
model-build = [
    "sentence-transformers>=3",
    "optimum[onnxruntime]>=1.23",
    "huggingface_hub>=0.25",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
classify = ["data/*.tsv"]

[tool.setuptools]
packages = [
    "affiliate",
    "db",
    "collect",
    "collect.sources",
    "collect.link",
    "curate",
    "enrich",
    "feeds",
    "pricing",
    "resolve",
    "catalog_build",
    "classify",
    "classify.suggest",
    "similarity",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Uzun SQL dizeleri (karar 0121 testleri).
"tests/test_catalog_build*.py" = ["E501"]
# Entegrasyon fixture'i baska modulden ice aktarilir (pytest deseni).
"tests/test_suggest_db.py" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Entegrasyon testleri yerel veritabanina baglanir; isaretli olsunlar ki
# veritabani olmadan `-m "not integration"` ile atlanabilsinler.
markers = [
    "integration: yerel PostgreSQL gerektirir",
]

# Vercel Queues abonesi (karar 0107). Vercel derleme aninda bu modulu ice alip
# ozel, kuyruk tetiklemeli bir fonksiyon uretir; herkese acik rota yoktur.
# Yalnizca Vercel `services` ile dagitilirsa anlam kazanir (kok vercel.json);
# bugunku dagitimda (Root Directory apps/web) hicbir etkisi yoktur.
[[tool.vercel.subscribers]]
entrypoint = "collect.link.subscriber"
