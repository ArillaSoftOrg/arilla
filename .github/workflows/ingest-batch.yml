name: Ingest batch

# Python toplu islerinin (docs/ops.md "Veri boru hatti") ELLE tetiklenen
# calistiricisi. TASLAK: zamanlama KAPALIDIR; bu is akisi kendiliginden hicbir
# sey calistirmaz. Etkinlestirmek icin asagidaki "Etkinlestirme" adimlari bir
# insan tarafindan, bilincli olarak yapilir.
#
# Kapsam (yalnizca veritabanina yazan, dis servis ve ucret icermeyen asamalar):
#   prices  python -m similarity --prices   fiyat istatistikleri + ozet onarimi
#   resolve python -m resolve --limit 5000  offer -> product eslestirme
#   edges   python -m similarity --edges    similarity_edge (embedding'leri okur)
# BILEREK YOK: `enrich` (ucretli Jina, maliyet karari gerekir) ve `collect`
# (merchant sitelerine dis ag erisimi). Bunlar ayri karar ister.
#
# Etkinlestirme (hicbiri bu PR ile yapilmaz):
#  1. Depo secret'i `INGEST_DATABASE_URL`: UYGULAMA rolu (`arilla_app`) baglantisi.
#     Sahip rolu (`DATABASE_URL_OWNER`) ASLA buraya konmaz. Bu, uretim veritabani
#     kimligini GitHub'a koymak demektir; guvenlik karari kullanicidadir.
#  2. Ilk kosuyu `workflow_dispatch` ile ve once bir kopya/staging DB ile deneyin.
#  3. Duzenli calistirmak icin alttaki `schedule` satirlarini acin ve asamalari
#     ayri is akislarina ya da matrise bolun (sira: resolve -> prices -> edges).
#
# Her kosu `job_run` tablosuna yazilir (trigger: elle = manual, zamanlanmis = cron);
# /yonetim/islemler gecikmeyi buradan okur (karar 0055).

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Calistirilacak asama"
        type: choice
        required: true
        options: [prices, resolve, edges]
  # schedule:
  #   - cron: "30 1 * * *"   # etkinlestirilirse: `stage` icin varsayilan secimi netlestirin

permissions:
  contents: read

# Ayni anda iki toplu is ayni tablolara yazmasin; calisani kesme, sirada bekle.
concurrency:
  group: ingest-batch
  cancel-in-progress: false

jobs:
  run:
    name: ${{ inputs.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JOB_RUN_TRIGGER: ${{ github.event_name == 'schedule' && 'cron' || 'manual' }}
      # Dis servis anahtari verilmez: bu asamalar model/embedding API'sine gitmez.
      JINA_API_KEY: ""
      GEMINI_API_KEY: ""
    steps:
      - name: Veritabani secret'i tanimli mi
        env:
          INGEST_DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
        run: |
          if [ -z "$INGEST_DATABASE_URL" ]; then
            echo "::error::INGEST_DATABASE_URL tanimli degil; calisma durduruldu (baglanti denenmedi)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ingest/pyproject.toml
      - run: pip install -e services/ingest
      - name: Asamayi calistir
        working-directory: services/ingest
        env:
          DATABASE_URL: ${{ secrets.INGEST_DATABASE_URL }}
          STAGE: ${{ inputs.stage }}
        run: |
          case "$STAGE" in
            prices)  python -m similarity --prices ;;
            resolve) python -m resolve --limit 5000 ;;
            edges)   python -m similarity --edges ;;
            *) echo "::error::bilinmeyen asama"; exit 1 ;;
          esac
