# Ozel anahtar korumasi (docs/decisions/0050). Bagimlilik kurmaz; yalnizca
# git ve node. Cikti dosya YOLU tasir, icerik asla.
name: security-checks

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# PR: yeni push eski koşuyu iptal eder. main: koşu sha'ya özel, asla iptal edilmez.
concurrency:
  group: security-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('sha-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  private-keys:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-private-keys.mjs
