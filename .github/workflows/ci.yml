# Derleme, statik denetim, birim testleri ve yönetim yetki/kapsam testleri
# (docs/decisions/0082). Güvenlik sınırı:
# - Hiçbir secret okunmaz; workflow'da `secrets.*` YOKTUR. Üretim veritabanı,
#   Redis, e-posta ya da ücretli API'ye (Gemini, Jina, Resend) bağlanılmaz.
# - Entegrasyon testleri yalnızca bu işe ait tek kullanımlık servis
#   konteynerleriyle (localhost) koşar; parolalar yalnızca bu konteynerler
#   içindir. Testlerin kendi yalıtım kapısı (`assertIsolatedTestUrl`) uzak
#   adresi zaten reddeder.
# - `pull_request` (fork dahil) salt okunur token ile çalışır.
name: ci

on:
  pull_request:
  # Merge queue (karar 0137): kuyruk grubu commit'i main'in güncel ucu + PR olarak tam koşar.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

# PR: aynı PR'a yeni push gelince eski koşu iptal edilir (geçersiz sonuç üretir).
# main: koşu commit sha'sına özeldir ve ASLA iptal edilmez; her main commit'i tam
# sonuç alır (build-push/deploy zinciri bu sonuçlara bakar).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('sha-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Testlerin ve derlemenin ortamdan model/e-posta anahtarı almadığını açıkça belirtir.
  GEMINI_API_KEY: ""
  LLM_API_KEY: ""
  JINA_API_KEY: ""
  RESEND_API_KEY: ""
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Yalnızca PR'larda: değişen dosyaların TAMAMI dokümantasyon ise ağır işler atlanır.
  # Atlanan iş, zorunlu kontrol olarak "başarılı" sayılır. main'e push'ta HER ZAMAN tam
  # koşu yapılır (build-push/deploy zorunlu kontrollerden `success` ister, `skipped` değil).
  # `docs/schema.sql` testlerce okunduğu için dokümantasyon sayılmaz. Belirsizlikte tam koşu.
  # typecheck + lint ve private-keys bu kapıya bağlı değildir; her zaman koşar.
  changes:
    name: değişiklik kapsamı
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          docs_only=false
          if [ "$EVENT" = "pull_request" ]; then
            files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
            count=$(printf '%s\n' "$files" | grep -c . || true)
            # API en fazla 3000 dosya döner; belirsizlikte tam koşu.
            if [ "$count" -gt 0 ] && [ "$count" -lt 3000 ]; then
              other=$(printf '%s\n' "$files" | grep -v -E '^(docs/|[^/]+\.md$)' || true)
              schema=$(printf '%s\n' "$files" | grep -x 'docs/schema.sql' || true)
              if [ -z "$other" ] && [ -z "$schema" ]; then docs_only=true; fi
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "docs_only=$docs_only"

  static:
    name: typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - name: PR politikası birim testleri (karar 0137)
        run: node --test scripts/pr-policy.test.mjs
      # Değişen dosyalar KESİN: PR'ın getirdiği her dosya biome'dan geçmeli.
      - name: lint (değişen dosyalar)
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then base="HEAD~1"; fi
          git diff --name-only --diff-filter=ACMR "$base"...HEAD > changed.txt
          echo "Değişen dosya sayısı: $(wc -l < changed.txt)"
          if [ -s changed.txt ]; then
            tr '\n' '\0' < changed.txt | xargs -0 pnpm exec biome ci \
              --files-ignore-unknown=true --no-errors-on-unmatched
          fi
      # Tüm depo: ana daldaki bilinen 17 bulgu (blog SVG'leri ve üç TS dosyası)
      # temizlenene dek uyarı olarak raporlanır; sayı ve dosyalar iş özetinde görünür.
      - name: lint (tüm depo, bilinen bulgular raporlanır)
        run: |
          set +e
          git ls-files -z | xargs -0 pnpm exec biome ci --colors=off \
            --files-ignore-unknown=true --no-errors-on-unmatched --max-diagnostics=200 > biome-all.txt 2>&1
          status=$?
          set -e
          files=$(grep -E '^\S+:[0-9]+:[0-9]+ ' biome-all.txt | sed -E 's/:[0-9]+:[0-9]+ .*//' | sort -u)
          {
            echo "### Biome (tüm depo)"
            echo "Çıkış kodu: $status"
            echo '```'
            echo "${files:-bulgu yok}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::warning title=biome (tüm depo)::Ana daldaki bilinen lint bulguları var; iş özetine bakın."
          fi

  unit:
    name: unit tests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Birim testleri veritabanı istemez; kapsam kaydı testleri
      # (`coverage.test.ts`, `coverage-pages.test.ts`) ve fiyat kuralları burada.
      - run: pnpm -r test

  python:
    name: python unit tests
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ingest/pyproject.toml
      - run: pip install -e ".[dev]"
      # Eslestirme regresyon seti (tests/test_resolve_regression.py) burada
      # kosar: esik degisince neyin bozuldugu yalnizca bu is ile gorulur.
      # Entegrasyon testleri veritabani ister; ayri bir is kurulana dek atlanir.
      # `python -m pytest`: gecerli klasoru (services/ingest) import yoluna ekler;
      # bazi testler `from tests.test_... import` kullanir, duz `pytest` bulamaz.
      - run: python -m pytest -m "not integration"

  build:
    name: web build
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Next.js derleme önbelleği (resmi öneri). Yalnızca hızlandırıcıdır: Next her girdiyi
      # içerik özetiyle doğrular. GitHub önbellek kapsamı: PR önbelleği main'e okunmaz/yazılmaz.
      - uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/**/*.ts', 'apps/web/**/*.tsx', 'packages/**/*.ts', 'packages/**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm --filter @arilla/web build

  # Karar 0109: VPS imajları derlenir ve gizli değer girmediği doğrulanır.
  # Yayın YOK (GHCR hattı sonraki faz); `secrets.*` kullanılmaz. `APP_URL` sır
  # değildir, derlemeye gömülür (robots/canonical).
  docker:
    name: docker images (web + migrate)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: build web
        run: >-
          docker build -f apps/web/Dockerfile
          --build-arg APP_URL=https://ci.example.test -t arilla-web:ci .
      - name: build migrate
        run: docker build -f apps/web/Dockerfile --target migrate -t arilla-migrate:ci .
      - name: imajda gizli dosya / sır yok, root değil
        run: bash infra/vps/bin/verify-image.sh arilla-web:ci arilla-migrate:ci
      - name: canlılık ucu (bağımlılıksız)
        run: |
          docker run -d --name web-ci -p 127.0.0.1:3000:3000 \
            -e APP_URL=https://ci.example.test arilla-web:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health && exit 0
            sleep 2
          done
          docker logs web-ci
          exit 1

  # Karar 0109 faz 2: uretim Compose yigini (infra/compose.prod.yml) atilabilir
  # sirlarla ayaga kalkar; temiz DB migration zinciri, ag yalitimi, Caddy
  # kapilari, cron ve sizinti kontrolleri infra/vps/bin/smoke-local.sh'tadir.
  # `secrets.*` kullanilmaz; sirlar kosu icinde rastgele uretilir ve silinir.
  compose-stack:
    name: compose stack (production topology)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Windows'ta `chmod +x` git'e yansimaz (core.filemode=false): shebang'li altyapi betigi
      # 100644 kalirsa VPS'te dogrudan calistirilamaz. Dagitim git archive ile modu tasir.
      - name: yurutme biti (depodaki shebang'li dosyalar 100755)
        run: |
          set -euo pipefail
          # Tum depo: scripts/check-private-keys.mjs infra/vps disinda kalip 100644 kalmisti.
          bad=$(git ls-files -s | while read -r mode _ _ path; do
            [ "$mode" = 100644 ] && [ "$(head -c 2 "$path" | tr -d '\000')" = '#!' ] && echo "$path"; done || true)
          [ -z "$bad" ] || { echo "::error::yurutme biti eksik (git update-index --chmod=+x):"; echo "$bad"; exit 1; }
      - name: shellcheck (dagitim ve altyapi betikleri)
        run: >-
          shellcheck -S warning -x
          infra/vps/bin/arilla-deploy infra/vps/bin/deploy-gate infra/vps/bin/install-deploy.sh
          infra/vps/bin/test-deploy.sh infra/vps/bin/test-ssh-gate.sh infra/vps/bin/smoke-local.sh infra/vps/bin/db-bootstrap.sh
          infra/vps/bin/init-secrets.sh infra/vps/bin/verify-image.sh infra/vps/cron/cron-call.sh
          infra/vps/bin/pg-backup infra/vps/bin/pg-backup-configure infra/vps/bin/pg-backup-activate
          infra/vps/bin/pg-restore-test infra/vps/bin/test-backup.sh infra/vps/backup/restore-inner.sh
          infra/vps/bin/batch-timers infra/vps/bin/catalog-publish infra/vps/bin/test-wal-backpressure.sh
      - name: duman testi
        run: bash infra/vps/bin/smoke-local.sh

  # Faz 6: dagitim motoru (yerel registry, sentetik depo; saglik gecmeyen surumde otomatik geri alma).
  # Duman testinden AYRI is: ikisi paralel kosar (eskiden ardisikti, ~430 sn). Ayni imajlari
  # kullanir; BUILD_ONLY=1 smoke-local.sh yalniz sablon dogrulamasi + imaj derlemesini yapip cikar
  # (ayni derleme tanimi, ayni :smoke etiketleri). Hicbir test atlanmaz.
  # DT_WEB_TIMEOUT: yalniz bu testte "saglik gecmeyen" surumun bekleme suresi. Uretim
  # varsayilani (arilla-deploy: ARILLA_HEALTH_TIMEOUT_WEB=240) DEGISMEZ. Saglikli web bu
  # testte ~15-25 sn'de ayaga kalkiyor; 75 sn ~3 kat pay birakir.
  deploy-engine:
    name: deploy engine (rollback + migration, local)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: imajlari derle (duman testiyle ayni tanim)
        env:
          BUILD_ONLY: "1"
        run: bash infra/vps/bin/smoke-local.sh
      - name: dagitim motoru testi
        env:
          DT_WEB_TIMEOUT: "75"
        run: bash infra/vps/bin/test-deploy.sh

  # Karar 0110: PostgreSQL yedekleme / WAL arsivi / PITR / izole geri yukleme uctan uca.
  # R2 yerine TLS'li S3 uyumlu sunucu (VersityGW), atilabilir sirlar; uretime ve R2'ye DOKUNMAZ.
  # Uretimle ayni sahiplik (root:999, 0640) icin root ile (sudo -E) calisir.
  backup-pitr:
    name: backup + PITR restore (pgBackRest, isolated)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: yedekleme ve geri yukleme testi
        run: sudo -E bash infra/vps/bin/test-backup.sh

  # Karar 0134: katalog yayini bekcisi (infra/vps/bin/catalog-publish) WAL kararlari, gercek
  # arsivleyen PostgreSQL 16 ile (yavas/hatali arsiv, disk, birakilan WAL, SIGTERM, devam).
  wal-backpressure:
    name: catalog publish watchdog (WAL backpressure)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: bash infra/vps/bin/test-wal-backpressure.sh

  # Faz 6: VPS yetki zinciri GERCEK sshd + sudo ile (tek kullanimlik Ubuntu 24.04 konteyneri):
  # install-deploy.sh -> sudoers -> restrict,command=deploy-gate -> sudo -> (sahte) arilla-deploy.
  deploy-gate:
    name: deploy ssh gate (sshd + sudo)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash infra/vps/bin/test-ssh-gate.sh

  integration:
    name: admin authz + integration (isolated services)
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # infra/docker-compose.yml ile aynı imaj (PostgreSQL 16 + pgvector).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arilla
          POSTGRES_PASSWORD: ci_only_owner
          POSTGRES_DB: arilla
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arilla -d arilla"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        # Yerel e-posta yakalayıcı: ileti makineden çıkmaz (kampanya testleri).
        image: axllent/mailpit:v1.31.2
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL_OWNER: postgresql://arilla:ci_only_owner@localhost:5432/arilla
      APP_DB_PASSWORD: ci_only_app
      DATABASE_URL: postgresql://arilla_app:ci_only_app@localhost:5432/arilla
      REDIS_URL: redis://localhost:6379
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      EMAIL_FROM: ci@example.test
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: schema (boş veritabanı)
        run: |
          pnpm db:migrate
          pnpm db:bootstrap-role
          pnpm db:partitions
          pnpm seed
      # Yönetim: yetki matrisi (her sayfa + her action, altı rol), oturum
      # politikası, denetim, işletim doğruluğu, kampanyalar (Mailpit) ve
      # diğer web sınırı testleri.
      - name: web integration (tümü)
        run: pnpm --filter @arilla/web exec vitest run -c vitest.integration.config.ts
      # Yönetim core'u + A0'ın dokunduğu model maliyeti yazan yollar.
      - name: core integration (yönetim, sohbet, sorgu yorumu)
        run: >-
          pnpm --filter @arilla/core exec vitest run -c vitest.integration.config.ts
          src/admin src/chat src/search/query-interpretation.integration.test.ts src/offers
          src/entitlement/charged-search.integration.test.ts src/web-search

  # Karar 0111: migration guvenligi + Python ingest entegrasyon testleri.
  # Kendi tek kullanimlik PostgreSQL'i vardir (web entegrasyon testleriyle veri paylasmaz).
  # 1) lint, 2) main'in migration'lariyla kurulup tohumlanan veritabanina bu dalin
  # YENI migration'lari uygulanir (yukseltme yolu, dolu tablolar), 3) ikinci kosu bos
  # gecmeli (idempotent), 4) db:verify (Drizzle uyumu + append-only yetkileri),
  # 5) Python entegrasyon testleri yeni semada (eski kod = N-1 uyumu kaniti).
  migrations-ingest:
    name: migrations (upgrade + verify) + ingest integration
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: arilla
          POSTGRES_PASSWORD: ci_only_owner
          POSTGRES_DB: arilla
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arilla -d arilla"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL_OWNER: postgresql://arilla:ci_only_owner@localhost:5432/arilla
      APP_DB_PASSWORD: ci_only_app
      DATABASE_URL: postgresql://arilla_app:ci_only_app@localhost:5432/arilla
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ingest/pyproject.toml
      - run: pnpm install --frozen-lockfile
      - name: migration lint
        run: pnpm --filter @arilla/db db:lint-migrations
      - name: main'in semasi + tohum veri
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          git ls-tree --name-only FETCH_HEAD packages/db/migrations/ | xargs -n1 basename | sort > "$RUNNER_TEMP/base.txt"
          find packages/db/migrations -maxdepth 1 -type f -printf '%f\n' | sort > "$RUNNER_TEMP/head.txt"
          mkdir -p "$RUNNER_TEMP/new-migrations"
          comm -13 "$RUNNER_TEMP/base.txt" "$RUNNER_TEMP/head.txt" | grep '\.sql$' > "$RUNNER_TEMP/new.txt" || true
          echo "Bu dalin yeni migration'lari:"; cat "$RUNNER_TEMP/new.txt"
          while read -r f; do mv "packages/db/migrations/$f" "$RUNNER_TEMP/new-migrations/"; done < "$RUNNER_TEMP/new.txt"
          pnpm db:migrate
          pnpm db:bootstrap-role
          pnpm db:partitions
          pnpm seed
          while read -r f; do mv "$RUNNER_TEMP/new-migrations/$f" packages/db/migrations/; done < "$RUNNER_TEMP/new.txt"
      - name: yeni migration'lar (dolu veritabanina) + idempotent ikinci kosu
        run: |
          set -euo pipefail
          pnpm db:migrate
          pnpm db:migrate | tee "$RUNNER_TEMP/second.txt"
          grep -q "Uygulanacak migration yok" "$RUNNER_TEMP/second.txt"
      - name: sema dogrulama (Drizzle + append-only yetkileri)
        run: pnpm db:verify
      # Karar 0134: WAL geri basinci testleri GERCEK arsiv ister. Yalniz bu atilabilir servis
      # konteynerinde arsiv acilir (kopyalamayan, gecikmesi/hatasi denetlenen komut).
      - name: WAL arsivini ac (yalniz CI servisi)
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/archive.sql" <<'SQL'
          ALTER SYSTEM SET archive_mode = on;
          ALTER SYSTEM SET archive_command = 'sh -c ''d=$(cat /tmp/archive_delay 2>/dev/null || echo 0); sleep $d; test ! -f /tmp/archive_fail''';
          ALTER SYSTEM SET max_wal_size = '256MB';
          SQL
          psql "$DATABASE_URL_OWNER" -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/archive.sql"
          docker restart "$PG_CONTAINER"
          for _ in $(seq 1 60); do pg_isready -h localhost -U arilla -d arilla && break; sleep 1; done
          psql "$DATABASE_URL_OWNER" -Atc "SHOW archive_mode" | grep -qx on
      - name: python ingest integration
        working-directory: services/ingest
        env:
          WAL_LAB_DATABASE_URL: postgresql://arilla:ci_only_owner@localhost:5432/postgres
        run: |
          pip install -e ".[dev]"
          python -m pytest -m integration

  # Tek zorunlu CI kontrolü (karar 0137): yukarıdaki işlerin TAMAMI başarılı ya da (salt
  # dokümantasyon PR'ında) atlanmış olmalı. Yeni iş eklenince `needs` listesine eklenir; dal
  # koruması iş adlarını tek tek bilmek zorunda kalmaz. Başarısız/iptal edilen iş asla geçmez.
  ci-ok:
    name: ci ok
    if: always()
    needs:
      - changes
      - static
      - unit
      - python
      - build
      - docker
      - compose-stack
      - deploy-engine
      - backup-pitr
      - wal-backpressure
      - deploy-gate
      - integration
      - migrations-ingest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: sonuçlar
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          [ -z "$bad" ] || { echo "::error::başarısız / iptal: $bad"; exit 1; }
          # Atlama yalnız PR'da (salt dokümantasyon) meşrudur; main ve merge queue tam koşar.
          if [ "$EVENT" != "pull_request" ]; then
            skipped=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result == "skipped") | .key] | join(", ")')
            [ -z "$skipped" ] || { echo "::error::$EVENT koşusunda atlanan iş: $skipped"; exit 1; }
          fi
