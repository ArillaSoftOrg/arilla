# Redis 7 - karar 0109. Link kuyrugu (queue:link_resolution), arama duvari,
# kota ve oran siniri sayaclari. Parola BU DOSYADA YOK: konteyner baslarken
# REDIS_PASSWORD'dan tmpfs'e yazilan /tmp/redis-auth.conf `include` edilir.

bind 0.0.0.0
port 6379
# protected-mode: parola tanimliyken de acik kalir (savunma katmani).
protected-mode yes
tcp-keepalive 60
timeout 0

# --- Dayaniklilik: AOF + RDB oneki ---------------------------------------------
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
save 900 1
save 300 10
save 60 10000
dir /data

# --- Bellek: asla eviction ------------------------------------------------------
# Kuyruk ve kota sayaclari sessizce silinmesin; dolarsa yazma hata verir (isteyen
# taraf bunu `RedisUnavailableError` olarak ele alir) ve izleme uyarir.
maxmemory 512mb
maxmemory-policy noeviction

# --- Guvenlik -------------------------------------------------------------------
# Yikici/yonetim komutlari uygulama istemcilerine kapali (uygulama bunlari kullanmaz).
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command DEBUG ""
rename-command KEYS ""

loglevel notice
include /tmp/redis-auth.conf
