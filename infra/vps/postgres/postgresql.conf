# PostgreSQL 16 - Hostinger KVM 4 (4 vCPU / 16 GB RAM, NVMe SSD), karar 0109.
# Konteyner bellek limiti 6 GB (infra/compose.prod.yml); degerler bunun icinde
# kalacak sekilde secildi. Baslangic degerleridir: veri buyuyunce olcerek
# ayarlanir (pgvector HNSW/IVFFlat indeksleri bellek ister).

# --- Baglanti ve kimlik dogrulama ---------------------------------------------
# Yalnizca Docker `data` agindan erisilir (internal, internetsiz, port yayini yok).
listen_addresses = '*'
port = 5432
# web 12 + worker 1 + migrate/bakim + yonetim; 60 yeterli ve bellegi sinirli tutar.
max_connections = 60
superuser_reserved_connections = 3
password_encryption = scram-sha-256
# Istemci kimlik dogrulama kurallari repoda surumlenir ve salt-okunur baglanir; initdb'nin
# veri dizinine yazdigi pg_hba.conf KULLANILMAZ (ilk kurulumda eksik/yalniz-localhost
# kalabiliyordu). Bkz. pg_hba.conf.
hba_file = '/etc/postgresql/pg_hba.conf'

# --- Bellek -------------------------------------------------------------------
shared_buffers = 2GB
effective_cache_size = 7GB
# Sorgu basina siralama/hash; 60 baglanti * birden fazla dugum icin muhafazakar.
work_mem = 16MB
maintenance_work_mem = 512MB
huge_pages = off

# --- WAL / checkpoint ---------------------------------------------------------
# wal_level=replica: WAL arsivleme (PITR) icin yeterli. archive_mode/archive_command BURADA
# DEGIL: yedekleme aktivasyonu (karar 0110, infra/vps/bin/pg-backup-activate) dagitimin
# dokunmadigi /opt/arilla/backup/pg/archive.conf'u yazar; dosya yoksa arsivleme kapali kalir
# (bu satir yeniden baslatmada zararsizdir). Etkinlesmesi PostgreSQL yeniden baslatmasi ister.
wal_level = replica
# Karar 0134 (toplu katalog yayini): wal_compression, max_wal_size, min_wal_size yeniden
# baslatma ISTEMEZ; `SELECT pg_reload_conf()` ile etkinlesir (dagitim kendisi yeniden yuklemez).
# zstd tam sayfa goruntulerini (FPI) pglz'den (`on`) daha iyi sikistirir: laboratuvarda ayni
# yayin yukunde WAL -35%. Arsiv (R2) darbogaz oldugu icin daha az WAL = daha hizli yayin.
wal_compression = zstd
# 4GB'ta yogun yazimda checkpoint'ler WAL ile tetikleniyor (dakikalar arayla) ve her checkpoint
# sonrasi ilk dokunusta FPI yaziliyor; 8x pay laboratuvarda WAL'i -34% dusurdu (zstd ile -39%).
# 16GB ile checkpoint'ler cogunlukla zamanli (15 dk) olur. Bedeli: pg_wal'da en fazla ~16GB
# yeniden kullanilacak segment (150GB bos diskte) ve cokme kurtarmasinda daha uzun WAL tekrari.
# Arsiv borcu bundan bagimsizdir (bkz. infra/vps/bin/catalog-publish).
max_wal_size = 16GB
min_wal_size = 2GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# --- SSD ------------------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Guvenlik ve dayaniklilik ---------------------------------------------------
# Terk edilmis islemler kilit/vacuum tutmasin.
idle_in_transaction_session_timeout = 60s
# Kopan istemciyi bulmak icin.
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6

# --- Zaman ve yerel ayar --------------------------------------------------------
# Tum zaman damgalari timestamptz, UTC (CLAUDE.md).
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
default_text_search_config = 'pg_catalog.simple'

# --- Sorgu istatistikleri (pg_stat_statements) -------------------------------------
# Hangi sorgunun pahali oldugu olculmeden darbogaz tahmindir. Normalize sorgu metni
# (parametreler $1, $2 olarak) ve sure/okuma sayaclari tutulur; parametre DEGERLERI
# (arama metni, kimlik) saklanmaz. Eklenti `packages/db/migrations/0081` ile kurulur;
# rapor: `node scripts/db-health.ts`. Etkinlesmesi YENIDEN BASLATMA ister (dagitim
# Postgres'i otomatik yeniden baslatmaz).
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
pg_stat_statements.track_utility = off
pg_stat_statements.save = on

# --- Gunluk (stderr -> docker logs; 10 MB x 3 donusum) ------------------------------
logging_collector = off
log_min_duration_statement = 500ms
# Yavas sorgu satirina baglanan parametre degerleri (arama metni, e-posta, kimlik)
# yazilmaz; yalnizca $n yer tutuculu sorgu metni kalir (KVKK: log'a kisisel veri yok).
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_checkpoints = on
log_lock_waits = on
log_temp_files = 10MB
log_autovacuum_min_duration = 1s
# Sorgu metni ve parametreler hata satirlarina girmesin (kisisel veri olabilir).
log_error_verbosity = default
log_min_error_statement = panic
log_connections = off
log_disconnections = off
log_line_prefix = '%m [%p] %q%u@%d '

# --- Yedekleme / WAL arsivi (karar 0110) --------------------------------------------
# Dosyanin SONUNDA: archive.conf'taki ayarlar yukaridakileri gecersiz kilabilir.
include_if_exists = '/etc/arilla-backup/archive.conf'
