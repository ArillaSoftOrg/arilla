name: arilla

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: arilla-postgres
    environment:
      POSTGRES_USER: arilla
      POSTGRES_PASSWORD: arilla_local
      POSTGRES_DB: arilla
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../packages/db/migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arilla -d arilla"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: arilla-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 uyumlu yerel obje deposu. Uretimde R2 veya S3 ile ayni API.
  minio:
    image: minio/minio:latest
    container_name: arilla-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: arilla
      MINIO_ROOT_PASSWORD: arilla_local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Yerel e-posta yakalama. Giris baglantilari buraya duser, disari gitmez.
  mailpit:
    image: axllent/mailpit:latest
    container_name: arilla-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  redis_data:
  minio_data:
